name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: unit tests (race)
        run: CGO_ENABLED=1 go test -race -count=1 ./...
      - name: build
        run: CGO_ENABLED=0 go build -trimpath -o whyslow ./cmd/whyslow

  integration:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: burner test
        run: go test -tags integration -count=1 -v ./test/integration/

  ebpf:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: kernel facts
        run: |
          uname -r
          ls -l /sys/kernel/btf/vmlinux
      - name: load eBPF programs and check per-PID bytes
        run: |
          go test -c -tags ebpf -o netbpf.test ./internal/netbpf/
          sudo ./netbpf.test -test.v -test.count=1
